{% extends 'base.html' %}

{% block title %}
Delete {{ pet.name }} - PetSafe QR
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm p-4 text-center">

                <div class="display-3">
                    ⚠️
                </div>

                <h2 class="mt-3">
                    Delete {{ pet.name }}?
                </h2>

                <p class="text-muted mt-3">
                    Are you sure you want to delete
                    <strong>{{ pet.name }}</strong>?
                </p>

                <p class="text-danger">
                    This action cannot be undone.
                </p>


                <form method="POST">

                    {% csrf_token %}

                    <div class="d-flex gap-2">

                        <a
                            href="{% url 'pet_detail' pet.pet_id %}"
                            class="btn btn-secondary w-50"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-danger w-50"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
