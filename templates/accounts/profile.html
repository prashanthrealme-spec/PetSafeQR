{% extends 'base.html' %}

{% block title %}
My Profile - PetSafe QR
{% endblock %}

{% block content %}

<div class="container py-5">

```
<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <div style="font-size: 60px;">
                        👤
                    </div>

                    <h2 class="fw-bold">
                        My Profile
                    </h2>

                    <p class="text-muted">
                        Keep your contact information updated.
                    </p>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ request.user.username }}"
                        disabled
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ request.user.get_full_name }}"
                        disabled
                    >

                </div>


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            📞 Phone Number
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            value="{{ profile.phone }}"
                            maxlength="15"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            📍 Area
                        </label>

                        <input
                            type="text"
                            name="area"
                            class="form-control"
                            value="{{ profile.area }}"
                            maxlength="100"
                            required
                        >

                    </div>


                    <div class="d-flex gap-2">

                        <a
                            href="{% url 'dashboard' %}"
                            class="btn btn-secondary w-50"
                        >
                            ← Dashboard
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary w-50"
                        >
                            💾 Save Changes
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
